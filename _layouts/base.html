<!doctype html>
<html class="flexible">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/css/main.css" rel="stylesheet" type="text/css">
        <link rel="shortcut icon" type="image/png" href="/favicon.png">

        <!-- Fetching a nice font -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap">

        <!-- highlight.js -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

        <!-- Fetching a preset theme -->
        <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/apprentice.css"> -->

        <!-- Using my own theme -->
        <link rel="stylesheet" href="/css/codeblocks.css">

        <!-- The script to execute it -->
        <script>hljs.highlightAll();</script>

        <!-- Getting MathJax to work and linebreak properly -->
        <script type="text/x-mathjax-config">
            MathJax.Hub.Config({
              tex2jax: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
                TeX: { extensions: ["autoload-all.js"] },
                "CommonHTML": { linebreaks: { automatic: true } }
            });
        </script>
        <script type="text/javascript" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>

    </head>

    <body>
        <header>{% include navigation.html %}</header>
        <main class="content">{{ content }}</main>
        <!-- <br> -->
        <footer>{%- include footer.html -%}</footer>

        <!-- This script is for the copy button for the codeblocks -->
        <script>
            const copyIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
            </svg>`;
            
            const checkIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>`;
            
            document.querySelectorAll('pre').forEach(pre => {
              const wrapper = document.createElement('div');
              wrapper.classList.add('code-wrapper');
              pre.parentNode.insertBefore(wrapper, pre);
              wrapper.appendChild(pre);
            
              const btn = document.createElement('button');
              btn.classList.add('copy-btn');
              btn.innerHTML = copyIcon;
              wrapper.appendChild(btn);
            
              btn.addEventListener('click', () => {
                const code = pre.querySelector('code');
                navigator.clipboard.writeText(code.innerText).then(() => {
                  btn.innerHTML = checkIcon;
                  setTimeout(() => btn.innerHTML = copyIcon, 2000);
                });
              });
            });
        </script>
    
    </body>
</html>
